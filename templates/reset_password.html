{% extends "base.html" %} {% block title %}Nova Senha - Pokémon{% endblock %} {% block content %}
<main class="auth-container">
  <div class="auth-card">
    <img src="{{ url_for('static', filename='uploads/utilidade/poke-ball.png') }}" alt="Pokébola" class="auth-icon" />
    <h1>NOVA SENHA</h1>
    <p style="color: #ccc; font-size: 13px; margin-bottom: 6px;">Defina uma nova senha para</p>
    <p style="color: var(--pokemon-yellow); font-size: 12px; font-weight: bold; margin-bottom: 4px;">{{ email }}</p>

    <form action="{{ url_for('auth.reset_password', email=email) }}" method="POST" class="auth-form">
      <div class="form-group">
        <label for="senha">NOVA SENHA</label>
        <input type="password" name="senha" id="senha" class="form-control"
               placeholder="Mínimo 4 caracteres" required minlength="4" />
      </div>
      <button type="submit" class="btn-abrir">SALVAR NOVA SENHA</button>
    </form>

    <div class="auth-footer">
      <a href="{{ url_for('auth.login') }}" style="color: #ccc; text-decoration: none;">Voltar ao Login</a>
    </div>
  </div>
</main>
{% endblock %}
