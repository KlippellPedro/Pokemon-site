{% extends "base.html" %} {% block title %}Nova Senha - Pokémon{% endblock %} {% block extra_css %}
<link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='css/pacotes.css') }}" />
<link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='css/equipe.css') }}" />
<link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='css/auth.css') }}" />
{% endblock %} {% block content %}
<div class="pacotes-container">
  <h1>NOVA SENHA</h1>
  <p class="auth-footer">Defina uma nova senha para <strong>{{ email }}</strong></p>
  <form action="{{ url_for('auth.reset_password', email=email) }}" method="POST" class="busca-equipe auth-form">
    <input type="password" name="senha" placeholder="Digite a nova senha" required id="input-equipe" />
    <button type="submit" id="btn-add">SALVAR NOVA SENHA</button>
  </form>
</div>
{% endblock %}
