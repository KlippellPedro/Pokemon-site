{% extends "base.html" %} {% block title %}Pokémon - Pokédex{% endblock %} {% block extra_css %}
<link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='css/pokedex.css') }}" />
{% endblock %} {% block content %}
<div class="pokedex-container">
  <h1>POKÉDEX NACIONAL</h1>

  <div class="busca-container">
    <div style="position: relative; width: 100%">
      <input
        type="text"
        id="pokemon-input"
        placeholder="Pesquisar nome ou número do pokémon..."
        onfocus="this.placeholder = ''"
        onblur="this.placeholder = 'Pesquisar nome ou número do pokémon...'"
        autocomplete="off"
      />

      <div id="pokedex-autocomplete-list" class="autocomplete-items"></div>
    </div>

    <button id="btn-busca">BUSCAR</button>

    <!-- Início dos Filtros -->
    <div class="pokedex-filtros">
      <div class="filtro-grupo">
        <select id="filtro-tipo" class="filtro-select">
          <option value="">Todos os Tipos</option>
          <option value="normal">Normal</option>
          <option value="fire">Fogo</option>
          <option value="water">Água</option>
          <option value="grass">Grama</option>
          <option value="electric">Elétrico</option>
          <option value="ice">Gelo</option>
          <option value="fighting">Lutador</option>
          <option value="poison">Veneno</option>
          <option value="ground">Terra</option>
          <option value="flying">Voador</option>
          <option value="psychic">Psíquico</option>
          <option value="bug">Inseto</option>
          <option value="rock">Pedra</option>
          <option value="ghost">Fantasma</option>
          <option value="dragon">Dragão</option>
          <option value="dark">Sombrio</option>
          <option value="steel">Aço</option>
          <option value="fairy">Fada</option>
        </select>

        <select id="filtro-geracao" class="filtro-select">
          <option value="">Todas as Gens</option>
          <option value="1">1ª Geração</option>
          <option value="2">2ª Geração</option>
          <option value="3">3ª Geração</option>
          <option value="4">4ª Geração</option>
          <option value="5">5ª Geração</option>
          <option value="6">6ª Geração</option>
          <option value="7">7ª Geração</option>
          <option value="8">8ª Geração</option>
          <option value="9">9ª Geração</option>
        </select>

        <button id="btn-limpar" class="btn-limpar">LIMPAR</button>
      </div>
    </div>
    <!-- Fim dos Filtros -->
  </div>

  <section id="pokedex-list" class="pokedex-grid"></section>

  <div class="controles">
    <button id="btn-carregar">CARREGAR MAIS</button>
  </div>
</div>
{% endblock %} {% block extra_js %}
<script src="{{ url_for('static', filename='js/pokedex.js') }}"></script>
{% endblock %}
