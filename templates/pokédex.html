{% extends "base.html" %} {% block title %}Pokémon - Pokédex{% endblock %} {% block extra_css %}
<link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='css/pokedex.css') }}" />
{% endblock %} {% block content %}
<div class="pokedex-container">
  <h1 data-i18n="pokedex.titulo">POKÉDEX NACIONAL</h1>

  <div class="busca-container">
    <div style="position: relative; width: 100%">
      <input
        type="text"
        id="pokemon-input"
        data-i18n-placeholder="pokedex.placeholder"
        placeholder="Pesquisar nome ou número do pokémon..."
        onfocus="this.placeholder = ''"
        onblur="this.placeholder = this.getAttribute('data-i18n-placeholder') ? t(this.getAttribute('data-i18n-placeholder')) : 'Pesquisar nome ou número do pokémon...'"
        autocomplete="off"
      />

      <div id="pokedex-autocomplete-list" class="autocomplete-items"></div>
    </div>

    <button id="btn-busca" data-i18n="pokedex.buscar">BUSCAR</button>

    <!-- Início dos Filtros -->
    <div class="pokedex-filtros">
      <div class="filtro-grupo">
        <select id="filtro-tipo" class="filtro-select">
          <option value="" data-i18n="pokedex.todos-tipos">Todos os Tipos</option>
          <option value="normal" data-i18n="tipo.normal">Normal</option>
          <option value="fire" data-i18n="tipo.fire">Fogo</option>
          <option value="water" data-i18n="tipo.water">Água</option>
          <option value="grass" data-i18n="tipo.grass">Grama</option>
          <option value="electric" data-i18n="tipo.electric">Elétrico</option>
          <option value="ice" data-i18n="tipo.ice">Gelo</option>
          <option value="fighting" data-i18n="tipo.fighting">Lutador</option>
          <option value="poison" data-i18n="tipo.poison">Veneno</option>
          <option value="ground" data-i18n="tipo.ground">Terra</option>
          <option value="flying" data-i18n="tipo.flying">Voador</option>
          <option value="psychic" data-i18n="tipo.psychic">Psíquico</option>
          <option value="bug" data-i18n="tipo.bug">Inseto</option>
          <option value="rock" data-i18n="tipo.rock">Pedra</option>
          <option value="ghost" data-i18n="tipo.ghost">Fantasma</option>
          <option value="dragon" data-i18n="tipo.dragon">Dragão</option>
          <option value="dark" data-i18n="tipo.dark">Sombrio</option>
          <option value="steel" data-i18n="tipo.steel">Aço</option>
          <option value="fairy" data-i18n="tipo.fairy">Fada</option>
        </select>

        <select id="filtro-geracao" class="filtro-select">
          <option value="" data-i18n="pokedex.todas-gens">Todas as Gens</option>
          <option value="1" data-i18n="pokedex.gen-1">1ª Geração</option>
          <option value="2" data-i18n="pokedex.gen-2">2ª Geração</option>
          <option value="3" data-i18n="pokedex.gen-3">3ª Geração</option>
          <option value="4" data-i18n="pokedex.gen-4">4ª Geração</option>
          <option value="5" data-i18n="pokedex.gen-5">5ª Geração</option>
          <option value="6" data-i18n="pokedex.gen-6">6ª Geração</option>
          <option value="7" data-i18n="pokedex.gen-7">7ª Geração</option>
          <option value="8" data-i18n="pokedex.gen-8">8ª Geração</option>
          <option value="9" data-i18n="pokedex.gen-9">9ª Geração</option>
        </select>

        <button id="btn-limpar" class="btn-limpar" data-i18n="pokedex.limpar">LIMPAR</button>
      </div>
    </div>
    <!-- Fim dos Filtros -->
  </div>

  <section id="pokedex-list" class="pokedex-grid"></section>

  <div class="controles">
    <button id="btn-carregar" data-i18n="pokedex.carregar">CARREGAR MAIS</button>
  </div>
</div>
{% endblock %} {% block extra_js %}
<script src="{{ url_for('static', filename='js/pokedex.js') }}"></script>
{% endblock %}
